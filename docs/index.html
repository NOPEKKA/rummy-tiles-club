<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Rummikub-style tile game for 2–4 players. Play friends online or practise against bots."><meta name="theme-color" content="#163a33"><style>html{color-scheme:dark}</style></head><body><title>Rummy Tiles Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Cinzel:wght@700;900&family=Playfair+Display:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen card-room table — a slim header, the shared felt in the middle, your own rack docked at whichever edge you choose. */
:root {
  --felt: #163a33;
  --felt-deep: #0e2823;
  --panel: #0b1f1b;
  --panel-2: #12302a;
  --line: #2a5249;
  --ink: #efe7d4;
  --muted: #9db4ac;
  --brass: #dca545;
  --brass-ink: #1d1407;
  --ivory: #f6eedb;
  --ivory-shade: #d9cbaa;
  --t-black: #1e1f24;
  --t-red: #cf1530;
  --t-blue: #1c5cae;
  --t-yellow: #ffae00;
  --ok: #63c993;
  --bad: #ff7262;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;
  --r: 10px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(120% 80% at 50% 0%, #1d4a41 0%, transparent 60%),
    repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
    var(--felt);
  color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; height: 100dvh; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
html, body { overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- buttons & fields ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  min-height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  font-weight: 600; letter-spacing: .01em; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.primary:hover { background: #e8b65a; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 13px; }
.btn.icon { width: 40px; padding: 0; }
.btn.small.icon { width: 32px; }
.field { display: grid; gap: 6px; }
.field > span, .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.input {
  height: 44px; padding: 0 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.input:focus { border-color: var(--brass); outline: none; }
.input.code { font-family: var(--font-mono); text-transform: lowercase; letter-spacing: .3em; }

/* ---------- tiles ----------
   The base look is ivory; .sk-* classes restyle a tile. Each colour also has its own
   pip under the numeral (bar, circle, diamond, triangle) so colours never have to be told apart by hue alone. */
.tile {
  --tw: var(--t, 44px);
  --edge: #d3c29b;
  --face: inset 0 1px 0 #fff;
  --ring: 0 0 0 0 transparent;
  --lift: 0 calc(var(--tw) * .06) 0 var(--edge), 0 calc(var(--tw) * .1) calc(var(--tw) * .16) rgba(0,0,0,.38);
  position: relative; box-sizing: border-box;
  width: var(--tw); height: calc(var(--tw) * 1.22);
  border-radius: calc(var(--tw) * .14);
  background: linear-gradient(180deg, #fffbf2 0%, #f7efdc 55%, #eadcbc 100%);
  box-shadow: var(--face), var(--ring), var(--lift);
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; line-height: 1;
  font-size: calc(var(--tw) * .56); font-variant-numeric: tabular-nums; color: #1b1c22;
  user-select: none; -webkit-user-select: none; touch-action: none; cursor: grab;
}
.tile .n { position: relative; z-index: 1; }
.tile::after {
  content: ''; position: absolute; left: 50%; bottom: 12%; width: 18%; height: 4.5%;
  transform: translateX(-50%); border-radius: 99px; background: currentColor; opacity: .75;
}
.tile.c1::after { width: calc(var(--tw) * .14); height: calc(var(--tw) * .14); border-radius: 50%; }
.tile.c2::after { width: calc(var(--tw) * .12); height: calc(var(--tw) * .12); border-radius: 1px; transform: translateX(-50%) rotate(45deg); bottom: 13%; }
.tile.c3::after { width: calc(var(--tw) * .19); height: calc(var(--tw) * .16); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.tile.joker::after { display: none; }
.tile.joker svg { width: 78%; height: 78%; position: relative; z-index: 1; }
.tile.j2 svg { transform: scaleX(-1); }
.tile.fresh { --ring: 0 0 0 2px var(--brass); }
.tile.last { --ring: 0 0 0 2px rgba(239,231,212,.6); }
.tile.sel { transform: translateY(-14%); --ring: 0 0 0 3px var(--brass); --lift: 0 calc(var(--tw) * .06) 0 var(--edge), 0 calc(var(--tw) * .24) calc(var(--tw) * .32) rgba(0,0,0,.48); }
.tile.lifting { opacity: .25; }
.tile.static { cursor: default; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; will-change: transform; filter: drop-shadow(0 14px 18px rgba(0,0,0,.5)); }

/* Ivory: polished bakelite, engraved numerals */
.tile.sk-ivory { --edge: #d3c29b; --face: inset 0 1px 0 #fff, inset 0 -2px 4px rgba(150,120,60,.18); }
.sk-ivory .n { text-shadow: 0 1px 0 rgba(255,255,255,.85); }
.sk-ivory.c0 { color: #1b1c22; }
.sk-ivory.c1 { color: #d3122f; }
.sk-ivory.c2 { color: #1559c7; }
.sk-ivory.c3 { color: #ffae00; }
.sk-ivory.c3 .n { text-shadow: 0 0 1px #6e4300, 0 0 1px #6e4300, 0 1px 0 rgba(255,255,255,.5); }

/* Arcane: obsidian with a gold rim, numerals glowing like gems */
.tile.sk-arcane {
  --edge: #07040f;
  --face: inset 0 0 0 1px rgba(255,214,120,.8), inset 0 0 0 calc(var(--tw) * .05) #170d2e, inset 0 0 0 calc(var(--tw) * .065) rgba(255,214,120,.32), inset 0 calc(var(--tw) * .2) calc(var(--tw) * .3) rgba(150,100,255,.2);
  background: radial-gradient(120% 90% at 50% 12%, #3f2574 0%, #1c1037 55%, #0d071c 100%);
  font-family: 'Cinzel', var(--font-display); font-weight: 900;
}
.sk-arcane::before { content: ''; position: absolute; inset: 16% 12% 22%; border-radius: 50%; border: 1px dashed rgba(184,146,255,.4); }
.sk-arcane .n { text-shadow: 0 0 calc(var(--tw) * .14) currentColor, 0 1px 1px rgba(0,0,0,.9); }
.sk-arcane.c0 { color: #ecebf8; }
.sk-arcane.c1 { color: #ff4766; }
.sk-arcane.c2 { color: #4aaaff; }
.sk-arcane.c3 { color: #ffd21f; }
.sk-arcane.joker svg { filter: drop-shadow(0 0 calc(var(--tw) * .06) rgba(255,210,31,.7)); }

/* Crystal: cut glass with a glint, glossy numerals */
.tile.sk-crystal {
  --edge: #9fb3d3;
  --face: inset 0 0 0 1px rgba(255,255,255,.95), inset 0 -4px 8px rgba(110,140,200,.3), inset 0 3px 4px rgba(255,255,255,.85);
  background: linear-gradient(155deg, #ffffff 0%, #eef4ff 40%, #d4e2f6 100%);
}
.sk-crystal::before { content: ''; position: absolute; left: 9%; right: 40%; top: 6%; height: 28%; border-radius: 40% 60% 50% 50%; background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0)); }
.sk-crystal .n {
  background: linear-gradient(180deg, color-mix(in srgb, currentColor 40%, #fff) 0%, currentColor 52%, color-mix(in srgb, currentColor 78%, #000) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 1px 0 rgba(255,255,255,.9));
}
.sk-crystal.c0 { color: #1e2236; }
.sk-crystal.c1 { color: #ff1f4b; }
.sk-crystal.c2 { color: #1f78ff; }
.sk-crystal.c3 { color: #ffb300; }
.sk-crystal.c3 .n { filter: drop-shadow(0 0 .6px #6e4300) drop-shadow(0 0 .6px #6e4300); }

/* Royal: cream card stock, a gold double rule, serif numerals */
.tile.sk-gilded {
  --edge: #b08a47;
  --face: inset 0 0 0 1.5px #c99b3c, inset 0 0 0 3px #fbf3df, inset 0 0 0 4px rgba(201,155,60,.75);
  background: radial-gradient(130% 100% at 50% 0%, #fffaf0, #f3e4c2 70%, #e9d3a3);
  font-family: 'Playfair Display', Georgia, serif; font-weight: 900;
}
.sk-gilded::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; opacity: .9;
  background: radial-gradient(circle at 16% 11%, #c99b3c 0 5%, transparent 6%), radial-gradient(circle at 84% 11%, #c99b3c 0 5%, transparent 6%),
              radial-gradient(circle at 16% 89%, #c99b3c 0 5%, transparent 6%), radial-gradient(circle at 84% 89%, #c99b3c 0 5%, transparent 6%);
}
.sk-gilded .n { font-variant-numeric: lining-nums tabular-nums; transform: translateY(-5%); }
.sk-gilded.c0 { color: #1b1a20; }
.sk-gilded.c1 { color: #c8102e; }
.sk-gilded.c2 { color: #164fb5; }
.sk-gilded.c3 { color: #ffa800; }
.sk-gilded.c3 .n { text-shadow: 0 0 1px #6a4000, 0 0 1px #6a4000; }

/* ---------- board (your rack) ---------- */
.board {
  position: relative; max-width: 100%; box-sizing: border-box;
  border-radius: 16px; overflow: hidden;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
}
.board.bg-walnut { --bd: #5b3820; background: repeating-linear-gradient(92deg, rgba(0,0,0,.07) 0 3px, transparent 3px 11px), linear-gradient(180deg, #7a4b2a, #4d2e17); }
.board.bg-felt { --bd: #1f5a46; background: radial-gradient(circle at 30% 20%, #2b7258, #1a4c3b); }
.board.bg-slate { --bd: #2b3440; background: linear-gradient(180deg, #3a4554, #232b36); }
.board.bg-cherry { --bd: #6d231c; background: linear-gradient(180deg, #8c342a, #5a1c16); }
.board.bg-sand { --bd: #b89f72; background: linear-gradient(180deg, #d8c39a, #b8a072); }
.board.bg-custom { --bd: var(--custom, #2f4a3f); background: linear-gradient(180deg, color-mix(in srgb, var(--bd) 85%, white), var(--bd)); }
.board-scroll { width: 100%; height: 100%; overflow: auto; display: flex; overscroll-behavior: contain; scrollbar-width: thin; }
.board-grid { margin: auto; display: flex; flex-direction: column; box-sizing: border-box; }
.board-row { display: flex; }
.cell {
  position: relative; flex: none;
  width: var(--t); height: calc(var(--t) * 1.3);
  display: flex; align-items: flex-start; justify-content: center;
}
.cell::before { /* the ledge each row of tiles stands on */
  content: ''; position: absolute; left: calc(var(--g) * -.5); right: calc(var(--g) * -.5); bottom: 0; height: calc(var(--t) * .07);
  background: rgba(0,0,0,.28); border-top: 1px solid rgba(255,255,255,.1);
}
.grid-on .cell { outline: 1px dashed rgba(255,255,255,.22); outline-offset: -1px; border-radius: 4px; }
.bg-sand.grid-on .cell { outline-color: rgba(60,40,10,.3); }
.cell.drop { background: rgba(220,165,69,.28); border-radius: 6px; }
.cell.drop-bad { background: rgba(255,114,98,.3); border-radius: 6px; }
.board.drop { box-shadow: 0 0 0 3px var(--brass), 0 10px 26px rgba(0,0,0,.4); }
.board-badge {
  position: absolute; right: 8px; top: 6px; z-index: 2; pointer-events: none;
  font: 600 11px/1 var(--font-mono); padding: 4px 6px; border-radius: 6px;
  background: rgba(0,0,0,.45); color: #f3ead6;
}

/* ---------- home ---------- */
.home { flex: 1; overflow: auto; padding-inline: 16px; padding-block: 28px 40px; }
.home-inner { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }
.hero { display: grid; gap: 14px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 800 clamp(34px, 7vw, 64px)/0.95 var(--font-display); letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.brand em { font-style: normal; color: var(--brass); }
.tagline { margin: 0; color: var(--muted); max-width: 52ch; font-size: 16px; }
.hero-tiles { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-end; --t: 42px; }
.hero-set { display: grid; gap: 6px; }
.hero-set .tiles { display: flex; gap: 4px; }
.hero-set small { color: var(--muted); font-size: 12px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.card { background: rgba(11,31,27,.78); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.card h2 { margin: 0; font: 700 20px/1.2 var(--font-display); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.note.warn { color: #f3c77a; }
.divider { height: 1px; background: var(--line); }
.tables-list { display: grid; gap: 8px; }
.table-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.table-item .code { font: 600 15px var(--font-mono); letter-spacing: .2em; }
.table-item .meta { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; color: var(--ink); }
.rules li::marker { color: var(--brass); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; min-height: 34px; color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }

/* ---------- lobby ---------- */
.lobby { flex: 1; overflow: auto; padding-inline: 16px; padding-block: 28px; }
.lobby-inner { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
.code-tiles { display: flex; gap: 8px; --t: 54px; }
.code-tiles .tile { color: var(--t-black); font-family: var(--font-mono); font-weight: 600; text-transform: uppercase; }
.seats { display: grid; gap: 8px; }
.seat { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); min-height: 52px; box-sizing: border-box; }
.seat.empty { border-style: dashed; color: var(--muted); background: transparent; }
.seat .nm { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.chip.brass { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ok); flex: none; }
.dot.off { background: #6b7f79; }

/* ---------- game ---------- */
.game { flex: 1; min-height: 0; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
.game > * { min-width: 0; }
.game.dock-top { grid-template-rows: auto auto minmax(0, 1fr); }
.game.dock-top .dock { order: 1; }
.game.dock-top .table-wrap { order: 2; }
.topbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-inline: 16px; padding-block: 8px; background: rgba(9,26,22,.86);
  border-bottom: 1px solid var(--line); position: relative; z-index: 3;
}
.topbar .mark { font: 800 18px var(--font-display); letter-spacing: -.02em; }
.topbar .mark em { font-style: normal; color: var(--brass); }
.topbar .code { font: 600 13px var(--font-mono); letter-spacing: .18em; color: var(--muted); }
.players { display: flex; gap: 6px; flex: 1 1 320px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.pchip {
  display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 8px; border-radius: 99px;
  background: var(--panel); border: 1px solid var(--line); flex: none; max-width: 200px;
}
.pchip .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pchip .ct { font: 600 12px var(--font-mono); color: var(--muted); }
.pchip .mini { width: 11px; height: 14px; border-radius: 2px; background: var(--ivory); flex: none; }
.pchip.turn { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass) inset; }
.pchip.turn .nm { color: var(--brass); }
.pool { display: flex; align-items: center; gap: 6px; font: 600 13px var(--font-mono); color: var(--muted); }
.table-wrap { min-height: 0; position: relative; display: flex; flex-direction: column; }
.status {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  padding-inline: 16px; padding-block: 8px; font-size: 14px; min-height: 22px;
}
.status .turnflag { font-weight: 700; color: var(--brass); }
.status .meld { font: 600 13px var(--font-mono); padding: 2px 8px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); }
.status .meld.ok { color: var(--ok); border-color: var(--ok); }
.status .logline { color: var(--muted); }
.table { flex: 1; min-height: 0; overflow: auto; position: relative; }
.tgrid {
  --ts: 40px; --t: var(--ts);
  display: grid; grid-template-columns: repeat(var(--cols), var(--ts)); grid-template-rows: repeat(var(--rows), calc(var(--ts) * 1.3));
  column-gap: 4px; row-gap: calc(var(--ts) * .12);
  width: max-content; margin: 0 auto; padding: 20px 16px 14px; box-sizing: border-box;
}
.tcell { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: center; border-radius: 6px; }
.can-drop .tcell { background: rgba(239,231,212,.035); box-shadow: inset 0 0 0 1px rgba(239,231,212,.08); }
.tcell.drop { background: rgba(220,165,69,.3); }
.tcell.drop-insert { background: rgba(220,165,69,.14); box-shadow: inset 3px 0 0 var(--brass); }
.tset { z-index: 0; margin: -5px -4px; border-radius: 10px; background: rgba(0,0,0,.18); border: 1px solid transparent; pointer-events: none; }
.tset.good { border-color: rgba(99,201,147,.55); }
.tset.bad { border-color: var(--bad); background: rgba(255,114,98,.12); }
.set { display: flex; gap: 3px; padding: 6px 6px 8px; border-radius: 10px; position: relative; background: rgba(0,0,0,.14); border: 1px solid transparent; }
.set.bad { border-color: var(--bad); background: rgba(255,114,98,.1); }
.set.bad::after { content: attr(data-why); position: absolute; left: 6px; top: 100%; margin-top: 2px; font-size: 11px; color: var(--bad); white-space: nowrap; }
.set.drop { border-color: var(--brass); background: rgba(220,165,69,.14); }
.table-empty { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); margin: 0; width: min(36ch, calc(100% - 32px)); text-align: center; color: var(--muted); font-size: 13px; pointer-events: none; }
.dock {
  display: flex; flex-direction: column; gap: 8px; padding-inline: 16px; padding-block: 8px 12px;
  background: linear-gradient(180deg, rgba(9,26,22,.0), rgba(9,26,22,.75) 30%);
  align-items: center; min-width: 0;
}
.dock.al-left { align-items: flex-start; }
.dock.al-right { align-items: flex-end; }
.game.dock-top .dock { background: linear-gradient(0deg, rgba(9,26,22,.0), rgba(9,26,22,.75) 30%); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; max-width: 100%; }
.dock.al-left .actions { justify-content: flex-start; }
.dock.al-right .actions { justify-content: flex-end; }
.actions .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
.zoom { display: inline-flex; align-items: center; gap: 2px; font: 600 12px var(--font-mono); color: var(--muted); }
.zoom output { min-width: 42px; text-align: center; }
.tray {
  display: flex; gap: 4px; flex-wrap: wrap; align-items: center; max-width: 100%; box-sizing: border-box;
  padding: 8px 10px; border-radius: 12px; border: 1px dashed rgba(239,231,212,.35); --t: 34px; min-height: 40px;
}

  /** Move tile `id` from `src` to `tgt`. All drag and tap moves end here. */

    if (!tgt || !src) return false;

    const toTable = tgt.kind === 'tcell';
    if ((fromTable || toTable) && !isMyTurn()) { toast(t('notYourTurn'), true); return false; }
    const fresh = draftFresh();
    if (fromTable && !toTable && !fresh.has(id)) { toast(t('tableStays'), true); return false; }
    let rack = S.rack;
    let draft = S.draft;
    if (toTable) {
      // anywhere on the table: an empty cell takes it, a full one makes room
      const res = TG.place(draft, id, tgt.r, tgt.c);
      if (!res.ok) { toast(t('rowFull'), true); return false; }
      S.pendingDrop = { id, valid: validKeys(S.draft) };
      draft = tidySetAt(res.grid, id);

      if (fromTable && rack.rows[tgt.r] && rack.rows[tgt.r][tgt.c] !== null) { toast(t('cellTaken'), true); return false; }
      const res = Rack.moveTo(rack, id, tgt);
      if (!res.ok) { toast(res.reason === 'occupied' ? t('cellTaken') : t('r_malformed'), true); return false; }
      rack = res.rack;

  /** Once the tiles around a drop make a legal set, put them in order where they lie. */

    const row = grid[at[0]];
    let a = at[1], b = at[1];
    while (a > 0 && row[a - 1] !== null) a--;
    while (b < row.length - 1 && row[b + 1] !== null) b++;

    const res = Rules.analyzeSet(set, S.view.rules);
    if (!res.ok || res.ordered.join() === set.join()) return grid;
    const g = TG.clone(grid);
    res.ordered.forEach((x, k) => { g[at[0]][a + k] = x; });
    return g;
  }

      st.capErr ? h('span', { class: 'err', text: t('sCapErr', { max: L.maxCells }) }) : null,
      impact ? h('span', { class: 'note' + (impact.toTray ? ' warn' : ''), text: t('sHand', { n: impact.total }) + ' · ' + (impact.overCapacity ? t('sOver', { n: impact.overCapacity }) : t('sFits')) }) : null);
    const cols = $('#s-cols'), colsR = $('#s-cols-r');
    if (cols) { cols.disabled = c.advanced; colsR.disabled = c.advanced; }
    renderPreview();
    const foot = $('#s-foot');
    const dirty = !BC.equal(c, S.config) || prefsDirty();
    const items = [];
    if (st.confirm) {
      items.push(h('div', { class: 'confirm', role: 'alertdialog', 'aria-labelledby': 's-confirm-t' },
        h('strong', { id: 's-confirm-t', text: t('sConfirmTitle') }),
        h('span', { text: t('sConfirmBody', { n: st.confirm.toTray }) }),
        h('div', { class: 'row' },
          h('button', { type: 'button', class: 'btn primary small', id: 's-confirm-apply', text: t('sConfirmApply'), onclick: () => applySettings(true) }),
          h('button', { type: 'button', class: 'btn small ghost', text: t('sConfirmBack'), onclick: () => { st.confirm = null; renderSettingsLive(); } }))));
    }
    items.push(h('span', { class: 'grow note', id: 's-dirty', text: st.notice || (dirty ? t('sUnsaved') : '') }));
    items.push(h('button', { type: 'button', class: 'btn ghost', id: 's-cancel', text: t('sCancel'), onclick: closeSettings }));
    items.push(h('button', {
      type: 'button', class: 'btn', id: 's-reset', text: t('sReset'), onclick: () => {
        st.draft = clone(BC.DEFAULTS); st.draft.rowCols = BC.DEFAULTS.rowCols.slice(); st.clean = BC.sanitize(st.draft).config;
        st.prefs = clone(Prefs.DEFAULTS); st.confirm = null;
        renderSettings(); st.notice = t('sResetDone'); renderSettingsLive();
      }
    }));
    items.push(h('button', { type: 'button', class: 'btn primary', id: 's-save', disabled: !!st.confirm, text: t('sSave'), onclick: () => applySettings(false) }));
    setKids(foot, items);
  }

  function previewRack(cfg) {
    const layout = BC.rowLayout(cfg);
    if (S.rack && S.screen === 'game') return Rack.resize(S.rack, layout).rack;
    let r = Rack.create(layout);
    SAMPLE.forEach(id => { r = Rack.add(r, id).rack; });
    return r;
  }
  function renderPreview() {
    const st = S.settings;
    const stage = $('#s-stage');
    if (!st || !stage) return;
    const cfg = st.clean, skin = st.prefs.skin;
    const dev = DEVICES[st.device];
    const rack = previewRack(cfg);
    const b = renderBoard(cfg, rack, { availWidth: dev.w - 32, maxHeight: dev.h * 0.62, userZoom: 1, live: false, skin });
    const top = cfg.position.startsWith('top');
    const al = cfg.position.endsWith('left') ? 'flex-start' : cfg.position.endsWith('right') ? 'flex-end' : 'center';
    const T = (c, n) => c * 13 + (n - 1);
    const fakeTable = h('div', { class: 'fake-table' },
      h('div', { class: 'set' }, [5, 6, 7].map(n => tileEl(T(2, n), 'static', null, skin))),
      h('div', { class: 'set' }, [0, 1, 3].map(c => tileEl(T(c, 11), 'static', null, skin))),
      h('div', { class: 'set' }, [12, 13, 1].map(n => tileEl(T(3, n), 'static', null, skin))));
    const dock = h('div', { class: 'dock', style: { alignItems: al } }, b.el);
    if (rack.overflow.length) {
      const tray = h('div', { class: 'tray' }, h('span', { class: 'label', text: t('tray') }));
      rack.overflow.forEach(id => tray.append(tileEl(id, 'static', null, skin)));
      dock.append(tray);
    }
    const device = h('div', { class: 'device', id: 's-device-frame', style: { width: dev.w + 'px', height: dev.h + 'px', gridTemplateRows: top ? '44px auto 1fr' : '44px 1fr auto' } },
      h('div', { class: 'fake-top' }, h('i', { style: { width: '90px' } }), h('i', { style: { width: '60px' } }), h('i', { style: { width: '60px' } })),
      top ? dock : fakeTable, top ? fakeTable : dock);
    stage.replaceChildren(device);
    const m = b.metrics;
    const read = $('#s-readout');
    if (read) setKids(read,
      h('span', null, h('b', { text: BC.capacityLabel(cfg) }), ' ' + t('sCellsUnit')),
      h('span', { text: t('sZoom', { z: Math.round(m.zoom * 100) }) }),
      h('span', { text: t('sTilePx', { px: Math.round(m.tile) }) }),
      h('span', { text: t('sFrame', { w: m.frameW, h: m.frameH }) }),
      m.pans ? h('span', { class: 'note warn', text: t('sPan', { px: BC.LIMITS.minReadableTile }) }) : null);
    const sw = stage.clientWidth - 24, sh = stage.clientHeight - 24;
    const scale = Math.max(0.05, Math.min(sw / dev.w, sh / dev.h, 1));
    Object.assign(device.style, { left: (stage.clientWidth - dev.w * scale) / 2 + 'px', top: (stage.clientHeight - dev.h * scale) / 2 + 'px', transform: 'scale(' + scale + ')' });
  }

  function applySettings(confirmed) {
    const st = S.settings;
    const cfg = BC.sanitize(st.draft).config;
    if (S.rack && S.screen === 'game') {
      const impact = Rack.resizeImpact(S.rack, BC.rowLayout(cfg));
      if (impact.toTray > 0 && !confirmed) { st.confirm = impact; renderSettingsLive(); const b = $('#s-confirm-apply'); if (b) b.focus(); return; }
      pushUndo();
      S.rack = Rack.resize(S.rack, BC.rowLayout(cfg)).rack;
      saveRack();
    }
    S.config = cfg;
    BC.save(storageAdapter, cfg);
    S.prefs = Prefs.sanitize(st.prefs);
    Prefs.save(storageAdapter, S.prefs);
    S.zoomUser = 1;
    closeSettings();
    toast(t('sSaved'));
  }

  // ---------- keyboard ----------
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (S.settings) { closeSettings(); return; }
      if (S.sel) { S.sel = null; render(); }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && S.screen === 'game' && !S.settings && !e.target.closest('input')) { e.preventDefault(); undo(); }
  });

  // ---------- boot ----------
  document.body.append(h('div', { id: 'settings-root' }));
  applyPrefs(S.prefs);
  render();
  // how many frames this screen can show (for the FPS setting)
  FX.measureHz().then(hz => { S.displayHz = hz; if (S.settings) renderSettings(); });
  // The open-tables list and the connection state only show on the menu; mid-game they must not redraw the table.
  Net.init(() => { if (S.screen === 'home' || S.screen === 'connecting') render(); });

  // Handle for automated checks (harmless for players).
  window.RKApp = { S, act, startLocal, performDrop, openSettings, applySettings, setDraft, setPref, renderNow, mountBoard, dropTargetAt, engineChanged, applyPrefs, tileEl };
})();

</script>
</body></html>
